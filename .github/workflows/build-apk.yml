name: Build Android APK

on:
  workflow_dispatch:        # دکمه‌ی Run workflow در تب Actions
  push:
    branches: [main]

permissions:
  contents: write      # برای ذخیره‌ی خودکار کلید امضا در همین مخزن خصوصی

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"
      VERSION_NAME: "1.1.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version code
        run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Bundle fonts and libraries inside the app
        run: node scripts/vendor-assets.mjs

      - name: Create Android project
        run: npx cap add android

      - name: Patch Android project (permissions, app name, version)
        run: |
          node scripts/patch-android.mjs
          node scripts/prepare-android.mjs

      - name: Generate icons and splash screen
        run: npx capacitor-assets generate --android

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build release APK (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' scripts/sign-apk.sh
          bash scripts/sign-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khaneyab-apk
          path: khaneyab-*.apk
          retention-days: 30

      - name: Upload key backup (first run only)
        if: steps.sign.outputs.new_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khaneyab-KEY-BACKUP
          path: keys/
          retention-days: 90

      - name: Save the new signing key in this private repository (first run only)
        if: steps.sign.outputs.new_key == 'true'
        run: |
          # اگر مخزن قانون Git LFS دارد، کلید باید به‌صورت فایل معمولی ذخیره شود
          git config filter.lfs.clean cat
          git config filter.lfs.smudge cat
          git config filter.lfs.process ""
          git config filter.lfs.required false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f keys/khaneyab.jks keys/signing.properties
          git commit -m "Add app signing key (auto-generated)"
          git push || { echo "::error::ذخیره‌ی کلید در مخزن ناموفق بود. کلید را از Artifact به اسم khaneyab-KEY-BACKUP دانلود و دستی در مخزن آپلود کن، وگرنه دفعه‌ی بعد کلید دیگری ساخته می‌شود."; exit 1; }
